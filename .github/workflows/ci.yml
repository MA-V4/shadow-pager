name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowpager_test
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shadowpager_test?sslmode=disable
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Wait for Postgres
        run: |
          if ! command -v pg_isready > /dev/null; then
            echo "pg_isready is not installed, so the tests rely on their own connect retry"
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Test
        run: go test -race -count=1 ./...

  vulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    # The scan reports but does not block yet, because the pinned versions in go.mod have known findings.
    continue-on-error: true
    steps:
      # The action checks the code out itself and only reports problems in code that this program really calls.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # The newest Go is used here, so the report is about our code and modules and not about an old toolchain.
          go-version-input: stable
          go-package: ./...

  bench:
    name: Benchmarks
    # Benchmark numbers are only kept for main, where they show how the code changes over time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          set -o pipefail
          go test -run '^$' -bench . -benchmem ./... | tee benchmarks.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: go-benchmarks
          path: benchmarks.txt
          retention-days: 90

  web:
    name: Web typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packages
        run: npm ci

      # Known problems of high or critical severity in any package stop the build.
      - name: Audit packages
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
