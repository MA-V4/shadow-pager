name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowpager_test
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shadowpager_test?sslmode=disable
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain line in go.mod is the one place that says which Go compiles this project.
      - name: Read the Go toolchain from go.mod
        id: toolchain
        run: echo "version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      # A build with any other Go would not be the build that was scanned for known problems.
      - name: Check the Go toolchain
        run: test "$(go env GOVERSION)" = "go${{ steps.toolchain.outputs.version }}"

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Wait for Postgres
        run: |
          if ! command -v pg_isready > /dev/null; then
            echo "pg_isready is not installed, so the tests rely on their own connect retry"
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Test
        run: go test -race -count=1 ./...

  vulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Go toolchain from go.mod
        id: toolchain
        run: echo "version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      # The scan only reports problems in code that this program really calls, and any finding fails the build.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.toolchain.outputs.version }}
          go-package: ./...
          repo-checkout: false

  bench:
    name: Benchmarks
    # Benchmark numbers are only kept for main, where they show how the code changes over time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain line in go.mod is the one place that says which Go compiles this project.
      - name: Read the Go toolchain from go.mod
        id: toolchain
        run: echo "version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true

      # A build with any other Go would not be the build that was scanned for known problems.
      - name: Check the Go toolchain
        run: test "$(go env GOVERSION)" = "go${{ steps.toolchain.outputs.version }}"

      - name: Run benchmarks
        run: |
          set -o pipefail
          go test -run '^$' -bench . -benchmem ./... | tee benchmarks.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-benchmarks
          path: benchmarks.txt
          retention-days: 90

  web:
    name: Web typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packages
        run: npm ci

      # Known problems of high or critical severity in any package stop the build.
      - name: Audit packages
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
