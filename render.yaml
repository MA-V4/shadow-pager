services:
  - type: web
    name: shadow-pager-api
    runtime: go
    plan: free
    # The build prints its Go version first, so the deploy log shows which toolchain compiled the binary.
    buildCommand: go version && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/server ./cmd/server
    startCommand: ./bin/server
    # The probe only asks if the process is up, so a database blip can never make Render restart the instance.
    healthCheckPath: /healthz
    envVars:
      # Render always installs the newest Go, so this forces the toolchain that go.mod pins, and a test keeps the two equal.
      - key: GOTOOLCHAIN
        value: go1.26.9+auto
      # Production switches on the TLS check for the database and the Strict-Transport-Security header.
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Slack secrets are typed into the Render dashboard and never stored in this file.
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_INVITE_USER_IDS
        sync: false
      - key: SLACK_ANNOUNCE_CHANNEL_ID
        sync: false
      # The database password is part of this URL, so it is typed into the Render dashboard too.
      - key: DATABASE_URL
        sync: false
      # The admin token is a secret, and the allowed website is your own Vercel address, so both are typed into the dashboard.
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_BURST
        value: "5"
      - key: RATE_LIMIT_REFILL
        value: 30s
      # Visitors may start drills without the token, and those drills never post to Slack.
      - key: PUBLIC_DRILLS
        value: "true"
      - key: PUBLIC_MAX_ACTIVE
        value: "5"
      - key: STREAM_MAX_TOTAL
        value: "100"
      - key: STREAM_MAX_PER_IP
        value: "5"
      # This assumes one proxy adds an address in front of the service, which docs/deploy.md explains how to check.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
