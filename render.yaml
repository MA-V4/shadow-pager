services:
  - type: web
    name: shadow-pager-api
    runtime: go
    plan: free
    buildCommand: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Slack secrets are typed into the Render dashboard and never stored in this file.
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_INVITE_USER_IDS
        sync: false
      - key: SLACK_ANNOUNCE_CHANNEL_ID
        sync: false
